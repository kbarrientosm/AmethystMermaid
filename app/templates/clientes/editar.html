
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar cliente | AmethystMermaid</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>

<body>

    <header>
        <h1>AmethystMermaid</h1>
        <p>Administración de clientes</p>
    </header>

    <main>

        <section class="seccion-productos">

            <h2>Editar cliente</h2>

            <form method="POST">

                <div>
                    <label for="nombre">Nombre completo:</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        value="{{ cliente.nombre }}"
                        maxlength="100"
                        required>
                </div>

                <div>
                    <label for="correo">Correo electrónico:</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        value="{{ cliente.correo }}"
                        maxlength="150"
                        required>
                </div>

                <div>
                    <label for="telefono">Teléfono:</label>
                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        value="{{ cliente.telefono }}"
                        maxlength="20"
                        required>
                </div>

                <div>
                    <label for="direccion">Dirección:</label>
                    <textarea
                        id="direccion"
                        name="direccion"
                        rows="4"
                        maxlength="250"
                        required>{{ cliente.direccion }}</textarea>
                </div>

                <button type="submit">
                    Guardar cambios
                </button>

            </form>

            <a href="{{ url_for('clientes.listar') }}">
                Volver a clientes
            </a>

        </section>

    </main>

    <footer>
        <p>AmethystMermaid - Bienestar y crecimiento personal</p>
    </footer>

</body>

</html>
