
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar empleado | AmethystMermaid</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>

<body>

    <main class="contenedor">

        <h1>Editar empleado</h1>

        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% if mensajes %}
                {% for categoria, mensaje in mensajes %}
                    <div class="mensaje {{ categoria }}">
                        {{ mensaje }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <label for="nombre">Nombre completo:</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                value="{{ empleado.nombre }}"
                required
            >

            <label for="cargo">Cargo:</label>
            <input
                type="text"
                id="cargo"
                name="cargo"
                value="{{ empleado.cargo }}"
                required
            >

            <label for="correo">Correo electrónico:</label>
            <input
                type="email"
                id="correo"
                name="correo"
                value="{{ empleado.correo }}"
                required
            >

            <label for="contrasena">Nueva contraseña (opcional):</label>
            <input
                type="password"
                id="contrasena"
                name="contrasena"
                placeholder="Dejar vacío para conservar la actual"
            >

            <label for="id_rol">Rol:</label>
            <select id="id_rol" name="id_rol" required>
                <option value="">Seleccione un rol</option>

                {% for rol in roles %}
                    <option
                        value="{{ rol.id_rol }}"
                        {% if rol.nombre == empleado.rol %}selected{% endif %}
                    >
                        {{ rol.nombre }}
                    </option>
                {% endfor %}
            </select>

            <button type="submit">Guardar cambios</button>

            <a href="{{ url_for('empleados.listar') }}" class="boton">
                Cancelar
            </a>

        </form>

    </main>

</body>
</html>
