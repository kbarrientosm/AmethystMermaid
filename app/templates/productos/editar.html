
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar producto | AmethystMermaid</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>

<body>

    <header>
        <h1>AmethystMermaid</h1>
        <p>Administración de productos</p>
    </header>

    <main>

        <section class="seccion-productos">

            <h2>Editar producto</h2>

            <form method="POST">

                <div>
                    <label for="nombre">Nombre del producto:</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        value="{{ producto.nombre }}"
                        maxlength="100"
                        required>
                </div>

                <div>
                    <label for="descripcion">Descripción:</label>
                    <textarea
                        id="descripcion"
                        name="descripcion"
                        rows="4"
                        required>{{ producto.descripcion }}</textarea>
                </div>

                <div>
                    <label for="precio">Precio (₡):</label>
                    <input
                        type="number"
                        id="precio"
                        name="precio"
                        value="{{ producto.precio }}"
                        min="0.01"
                        step="0.01"
                        required>
                </div>

                <div>
                    <label for="stock_minimo">Stock mínimo:</label>
                    <input
                        type="number"
                        id="stock_minimo"
                        name="stock_minimo"
                        value="{{ producto.stock_minimo }}"
                        min="0"
                        required>
                </div>

                <div>
                    <label for="id_categoria">Categoría:</label>
                    <select
                        id="id_categoria"
                        name="id_categoria"
                        required>

                        {% for categoria in categorias %}

                            <option
                                value="{{ categoria.id_categoria }}"
                                {% if producto.id_categoria == categoria.id_categoria %}selected{% endif %}>

                                {{ categoria.nombre }}

                            </option>

                        {% endfor %}

                    </select>
                </div>

                <button type="submit">
                    Guardar cambios
                </button>

            </form>

            <p>
                Existencias actuales: <strong>{{ producto.stock }}</strong>
            </p>

            <p>
                El stock se administra mediante los movimientos de inventario.
            </p>

            <a href="{{ url_for('productos.listar') }}">
                Volver al inventario
            </a>

        </section>

    </main>

    <footer>
        <p>AmethystMermaid - Bienestar y crecimiento personal</p>
    </footer>

</body>

</html>
